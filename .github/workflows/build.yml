name: Build Pirate Hat Fabric Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Gradle
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build
          elif [ -f ./gradlew.bat ]; then
            gradle build
          else
            gradle build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: pirate-hat-zombie-fabric-jar
          path: build/libs/*.jar
